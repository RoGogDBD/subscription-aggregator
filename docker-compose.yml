version: "3.9"

services:
  app:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - RUN_ADDR=${RUN_ADDR}
      - LOG_LEVEL=${LOG_LEVEL}
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    image: migrate/migrate
    volumes:
      - ./migrations:/migrations
    env_file:
      - .env
    entrypoint: [ "sh", "-c", "until pg_isready -h db -p 5432 -U ${POSTGRES_USER}; do sleep 1; done && migrate -path=/migrations -database=${DATABASE_URL} up" ]
    depends_on:
      - db
    restart: on-failure

volumes:
  postgres_data:
